<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>RENAGEI Conecta MS · Dinâmica em Grupo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #050f24;
  --navy-card: #0c1c3a;
  --azul: #3780dc;
  --azul-dark: #1c4a94;
  --verde: #65a142;
  --verde-dark: #3d7a2a;
  --text-dim: #93a3c0;
  --border: #1b2d52;
  --eixo: #3780dc;
  --eixo-dark: #1c4a94;
  --eixo-clara: rgba(55,128,220,0.18);
  --eixo-clara-texto: #7fb2ee;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { min-height:100%; font-family:"Inter",sans-serif; background:var(--navy); color:#fff; }
.app { max-width:560px; margin:0 auto; min-height:100vh; padding:32px 22px 48px; display:flex; flex-direction:column; }
.screen { display:none; flex:1; flex-direction:column; }
.screen.active { display:flex; animation:fadeIn .25s ease; }
@keyframes fadeIn { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

.eyebrow { font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--text-dim); font-weight:700; text-align:center; margin-bottom:8px; }
.titulo-evento { font-size:26px; font-weight:900; text-align:center; margin-bottom:4px; }
.titulo-evento .conecta { color:var(--verde); }
.titulo-evento .ms { color:var(--azul); }
.subtitulo-evento { font-size:13px; color:var(--text-dim); text-align:center; margin-bottom:44px; line-height:1.5; }

.pergunta-home { font-size:20px; font-weight:800; text-align:center; margin-bottom:28px; line-height:1.35; }

.eixo-btn { display:block; width:100%; border-radius:18px; padding:24px 22px; margin-bottom:18px; border:2px solid transparent; cursor:pointer; text-align:left; color:#fff; }
.eixo-btn.azul { background:linear-gradient(135deg, var(--azul-dark), #123469); border-color:var(--azul); }
.eixo-btn.verde { background:linear-gradient(135deg, var(--verde-dark), #275219); border-color:var(--verde); }
.eixo-btn .num { font-size:12px; font-weight:800; letter-spacing:2px; text-transform:uppercase; opacity:0.85; margin-bottom:8px; }
.eixo-btn .nome { font-size:18px; font-weight:800; line-height:1.3; }

.link-ver-tudo { display:block; text-align:center; margin-top:auto; padding-top:30px; color:var(--text-dim); font-size:13.5px; background:none; border:none; cursor:pointer; text-decoration:underline; }

.voltar-link { align-self:flex-start; font-size:13px; color:var(--text-dim); background:none; border:none; cursor:pointer; padding:0; margin-bottom:20px; }

.form-card { background:var(--navy-card); border:1.5px solid var(--border); border-radius:20px; padding:26px 22px; margin-bottom:20px; }
.eixo-tag { display:inline-block; font-size:11px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; padding:6px 14px; border-radius:999px; margin-bottom:14px; background:var(--eixo-clara); color:var(--eixo-clara-texto); }
.form-card h1 { font-size:19px; font-weight:800; line-height:1.35; }

.campo { margin-bottom:18px; }
.campo label { display:block; font-size:13.5px; font-weight:700; margin-bottom:8px; line-height:1.4; }
.campo .qnum { color:var(--eixo); margin-right:4px; }
.campo input, .campo textarea { width:100%; padding:14px 16px; border-radius:12px; border:1.5px solid var(--border); background:#0a1730; color:#fff; font-size:14.5px; font-family:inherit; outline:none; }
.campo input:focus, .campo textarea:focus { border-color:var(--eixo); }
.campo textarea { min-height:76px; resize:vertical; line-height:1.5; }
.campo input::placeholder, .campo textarea::placeholder { color:#4a5b7e; }

.btn { display:block; width:100%; padding:17px; border-radius:999px; border:none; font-size:16px; font-weight:800; text-align:center; cursor:pointer; font-family:inherit; }
.btn-primary { background:var(--eixo); color:#fff; }
.btn-primary:disabled { opacity:.5; cursor:not-allowed; }
.btn-ghost { background:transparent; color:var(--eixo); border:1.5px solid var(--eixo); margin-top:12px; }

.toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:#fff; color:var(--navy); padding:14px 20px; border-radius:12px; font-size:14px; max-width:90%; z-index:999; opacity:0; pointer-events:none; transition:all .25s ease; text-align:center; font-weight:600; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.toast.error { background:#c0392b; color:#fff; }

/* Lista de todos os grupos (sem login) */
.grupo-item { display:flex; align-items:center; justify-content:space-between; background:var(--navy-card); border:1.5px solid var(--border); border-radius:14px; padding:16px 18px; margin-bottom:12px; cursor:pointer; }
.grupo-item .info .nome { font-weight:700; font-size:15px; }
.grupo-item .info .eixo { font-size:12px; color:var(--text-dim); margin-top:2px; }
.grupo-item .abrir { font-size:13px; font-weight:700; color:var(--eixo); }
.vazio-msg { text-align:center; color:var(--text-dim); font-size:14px; padding:40px 20px; }

/* ===== TELÃO ===== */
#screen-telao.active { display:flex; }
#screen-telao { position:fixed; inset:0; width:100vw; height:100vh; z-index:100; background:var(--navy); }
.tl-stage { position:relative; width:100%; height:100%; overflow:hidden; }
.tl-slide { position:absolute; inset:0; display:none; flex-direction:column; padding:clamp(30px,5vh,70px) clamp(24px,6vw,110px); }
.tl-slide.active { display:flex; }
.tl-topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:clamp(20px,3.5vh,50px); flex-shrink:0; }
.tl-eixo-tag { font-size:clamp(12px,1vw,16px); font-weight:800; letter-spacing:2px; text-transform:uppercase; padding:8px 18px; border-radius:999px; background:var(--eixo-clara); color:var(--eixo-clara-texto); }
.tl-grupo-nome { font-size:clamp(20px,2.4vw,36px); font-weight:900; }
.tl-titulo-eixo { font-size:clamp(18px,2.2vw,34px); font-weight:800; line-height:1.3; margin-bottom:clamp(24px,4vh,50px); flex-shrink:0; }
.tl-grid { display:grid; gap:clamp(14px,1.8vw,28px); flex:1; min-height:0; }
.tl-arrow { position:fixed; top:50%; transform:translateY(-50%); width:clamp(44px,4vw,64px); height:clamp(44px,4vw,64px); border-radius:50%; background:var(--navy-card); border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:clamp(18px,1.8vw,26px); color:#fff; z-index:5; cursor:pointer; }
.tl-arrow.left { left:clamp(14px,2vw,32px); } .tl-arrow.right { right:clamp(14px,2vw,32px); }
.tl-arrow.hidden { visibility:hidden; }
.tl-dots { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:6; }
.tl-dots span { width:9px; height:9px; border-radius:50%; background:var(--border); cursor:pointer; transition:all .2s; }
.tl-dots span.active { background:var(--eixo); width:26px; border-radius:6px; }
.tl-card { background:var(--navy-card); border:1.5px solid var(--border); border-radius:20px; padding:clamp(18px,2.2vw,30px); display:flex; flex-direction:column; min-height:0; }
.tl-card .num { display:inline-flex; align-items:center; justify-content:center; width:clamp(30px,2.4vw,42px); height:clamp(30px,2.4vw,42px); border-radius:50%; background:var(--eixo); color:#fff; font-weight:800; font-size:clamp(13px,1.1vw,17px); margin-bottom:clamp(10px,1.4vh,16px); flex-shrink:0; }
.tl-card .pergunta { font-size:clamp(12px,1vw,16px); color:var(--eixo-clara-texto); font-weight:700; margin-bottom:clamp(8px,1.2vh,12px); line-height:1.35; flex-shrink:0; }
.tl-card .resposta { font-size:clamp(13px,1.25vw,20px); line-height:1.5; font-weight:500; overflow-y:auto; }
.tl-exit { position:fixed; bottom:24px; left:24px; font-size:13px; color:var(--text-dim); background:var(--navy-card); border:1px solid var(--border); padding:8px 18px; border-radius:999px; cursor:pointer; z-index:6; }
</style>
</head>
<body>
<div class="app" id="app-wrap">

  <!-- ===== HOME ===== -->
  <div class="screen active" id="screen-home">
    <div class="eyebrow">RENAGEI Conecta MS</div>
    <div class="titulo-evento">Dinâmica em <span class="conecta">Grupo</span></div>
    <div class="subtitulo-evento">Liderança e Governança Pública: da estratégia à entrega de valor</div>

    <div class="pergunta-home">Selecione o eixo do seu grupo</div>

    <button class="eixo-btn azul" data-eixo="governanca">
      <div class="num">Eixo 1</div>
      <div class="nome">Governança, Estratégia e Capacidade de Execução</div>
    </button>

    <button class="eixo-btn verde" data-eixo="digital">
      <div class="num">Eixo 2</div>
      <div class="nome">Transformação Digital em Rede: IA, Dados, Integração e Inovação</div>
    </button>

    <button class="link-ver-tudo" id="btn-ver-todos">Ver respostas de todos os grupos</button>
  </div>

  <!-- ===== FORMULÁRIO ===== -->
  <div class="screen" id="screen-form">
    <button class="voltar-link" id="btn-voltar-home">← Trocar de eixo</button>

    <div class="form-card">
      <span class="eixo-tag" id="f-eixo-tag">Eixo</span>
      <h1 id="f-eixo-titulo">Título do eixo</h1>
    </div>

    <div class="campo">
      <label>Nome do grupo</label>
      <input type="text" id="f-grupo" placeholder="Ex: Grupo 1">
    </div>

    <div id="f-perguntas-container"></div>

    <button class="btn btn-primary" id="btn-salvar">Salvar respostas</button>
    <button class="btn btn-ghost" id="btn-apresentar">Apresentar respostas</button>
  </div>

  <!-- ===== LISTA DE TODOS OS GRUPOS ===== -->
  <div class="screen" id="screen-lista">
    <button class="voltar-link" id="btn-voltar-home-2">← Início</button>
    <div class="pergunta-home" style="text-align:left; font-size:19px; margin-bottom:22px;">Respostas de todos os grupos</div>
    <div id="lista-grupos"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<!-- ===== TELÃO ===== -->
<div class="screen" id="screen-telao">
  <div class="tl-stage" id="tl-stage"></div>
  <div class="tl-arrow left" id="tl-prev">‹</div>
  <div class="tl-arrow right" id="tl-next">›</div>
  <div class="tl-dots" id="tl-dots"></div>
  <div class="tl-exit" id="tl-exit">← Voltar</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, getDoc, getDocs,
  serverTimestamp, enableIndexedDbPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ============================================================
// CONFIGURAÇÃO DO FIREBASE — troque pelos dados do projeto novo
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyAYFW-gdSo6mogEHB-TsoIVdwSkeLrBrBc",
  authDomain: "renagei-conecta-ms.firebaseapp.com",
  projectId: "renagei-conecta-ms",
  storageBucket: "renagei-conecta-ms.firebasestorage.app",
  messagingSenderId: "706430893393",
  appId: "1:706430893393:web:f3d34677dbd8f24daee770"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
enableIndexedDbPersistence(db).catch(() => {});

// ============================================================
// DADOS DOS EIXOS
// ============================================================
const EIXOS = {
  governanca: {
    nome: "Governança, Estratégia e Capacidade de Execução",
    cor: "#3780dc", corDark: "#1c4a94", corClara: "rgba(55,128,220,0.18)", corClaraTexto: "#7fb2ee",
    perguntas: [
      "Qual problema o grupo identificou?",
      "Quais experiências das Procuradorias podem contribuir para esse problema?",
      "O que aprendemos com essas experiências?",
      "Quais são os 3 principais caminhos possíveis?",
      "O que pode ser construído em conjunto pela RENAGEI?",
      "O que pode ser feito nos próximos 90 dias?",
      "Qual é o próximo passo do grupo?"
    ]
  },
  digital: {
    nome: "Transformação Digital em Rede: IA, Dados, Integração e Inovação",
    cor: "#65a142", corDark: "#3d7a2a", corClara: "rgba(101,161,66,0.18)", corClaraTexto: "#9fd17e",
    perguntas: [
      "Qual problema o grupo identificou?",
      "Quais experiências ou soluções já existentes podem contribuir para esse problema?",
      "O que aprendemos com essas experiências?",
      "Quais são os 3 principais caminhos possíveis?",
      "O que pode ser construído ou compartilhado pela RENAGEI?",
      "O que pode ser testado nos próximos 90 dias?",
      "Qual é o próximo passo do grupo?"
    ]
  }
};

let eixoAtualKey = null;
let telaAnterior = "screen-home";

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo({ top: 0, behavior: "instant" });
}

function showToast(msg, tipo = "") {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.className = "toast show" + (tipo ? " " + tipo : "");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 3500);
}

function aplicarCorEixo(key) {
  const eixo = EIXOS[key];
  document.documentElement.style.setProperty("--eixo", eixo.cor);
  document.documentElement.style.setProperty("--eixo-dark", eixo.corDark);
  document.documentElement.style.setProperty("--eixo-clara", eixo.corClara);
  document.documentElement.style.setProperty("--eixo-clara-texto", eixo.corClaraTexto);
}

function esc(str) { return (str || "").toString().replace(/</g, "&lt;"); }

// ============================================================
// HOME
// ============================================================
document.querySelectorAll(".eixo-btn").forEach(btn => {
  btn.addEventListener("click", () => abrirFormulario(btn.dataset.eixo));
});
document.getElementById("btn-voltar-home").addEventListener("click", () => showScreen("screen-home"));
document.getElementById("btn-voltar-home-2").addEventListener("click", () => showScreen("screen-home"));

function abrirFormulario(key) {
  eixoAtualKey = key;
  aplicarCorEixo(key);
  const eixo = EIXOS[key];
  const eixoNum = key === "governanca" ? "Eixo 1" : "Eixo 2";

  document.getElementById("f-eixo-tag").textContent = eixoNum;
  document.getElementById("f-eixo-titulo").textContent = eixo.nome;
  document.getElementById("f-grupo").value = "";

  const container = document.getElementById("f-perguntas-container");
  container.innerHTML = eixo.perguntas.map((p, i) => `
    <div class="campo">
      <label><span class="qnum">${i + 1}.</span>${esc(p)}</label>
      <textarea id="f-q${i + 1}"></textarea>
    </div>
  `).join("");

  showScreen("screen-form");
}

// ============================================================
// SALVAR
// ============================================================
function coletarDados() {
  const eixo = EIXOS[eixoAtualKey];
  return {
    eixo: eixoAtualKey,
    eixoNome: eixo.nome,
    grupo: document.getElementById("f-grupo").value.trim(),
    perguntas: eixo.perguntas,
    respostas: eixo.perguntas.map((_, i) => document.getElementById(`f-q${i + 1}`).value.trim()),
    atualizadoEm: serverTimestamp()
  };
}

function idDoDocumento(eixoKey, grupoNome) {
  const slug = grupoNome.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  return `${eixoKey}__${slug || "grupo"}`;
}

document.getElementById("btn-salvar").addEventListener("click", async () => {
  const dados = coletarDados();
  if (!dados.grupo) {
    showToast("Digite o nome do grupo antes de salvar.", "error");
    return;
  }
  const btn = document.getElementById("btn-salvar");
  btn.disabled = true;
  btn.textContent = "Salvando...";
  try {
    const id = idDoDocumento(dados.eixo, dados.grupo);
    await setDoc(doc(db, "respostas", id), dados, { merge: true });
    showToast("Respostas salvas com sucesso!");
  } catch (e) {
    showToast("Erro ao salvar: " + (e.message || e.code), "error");
  }
  btn.disabled = false;
  btn.textContent = "Salvar respostas";
});

// ============================================================
// APRESENTAR (a partir do próprio formulário)
// ============================================================
document.getElementById("btn-apresentar").addEventListener("click", () => {
  const dados = coletarDados();
  if (!dados.grupo) {
    showToast("Digite o nome do grupo antes de apresentar.", "error");
    return;
  }
  abrirTelao(dados, "screen-form");
});

function chunk(arr, size) {
  const out = [];
  for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
  return out;
}

let slideAtual = 1;
let totalSlides = 1;

function abrirTelao(dados, origem) {
  telaAnterior = origem || "screen-form";
  aplicarCorEixo(dados.eixo);
  const eixoNum = dados.eixo === "governanca" ? "Eixo 1" : "Eixo 2";

  // divide as 7 perguntas em blocos de até 4 por slide (aqui: 3 + 4)
  const itens = dados.perguntas.map((p, i) => ({ pergunta: p, resposta: dados.respostas[i] }));
  const grupos = chunk(itens, itens.length > 4 ? Math.ceil(itens.length / 2) : itens.length);
  // garante no máximo 4 por slide, reagrupando se ficou grande demais
  const gruposFinal = [];
  grupos.forEach(g => {
    if (g.length > 4) {
      gruposFinal.push(...chunk(g, Math.ceil(g.length / Math.ceil(g.length / 4))));
    } else {
      gruposFinal.push(g);
    }
  });

  const stage = document.getElementById("tl-stage");
  stage.innerHTML = gruposFinal.map((grupo, gi) => `
    <div class="tl-slide ${gi === 0 ? "active" : ""}" data-slide="${gi + 1}">
      <div class="tl-topbar">
        <span class="tl-eixo-tag">${eixoNum}</span>
        <span class="tl-grupo-nome">${esc(dados.grupo)}</span>
      </div>
      <div class="tl-titulo-eixo">${esc(dados.eixoNome)}</div>
      <div class="tl-grid" style="grid-template-columns:repeat(${grupo.length},1fr);">
        ${grupo.map((item, i) => {
          const numGlobal = gruposFinal.slice(0, gi).reduce((a, g) => a + g.length, 0) + i + 1;
          return `
            <div class="tl-card">
              <div class="num">${numGlobal}</div>
              <div class="pergunta">${esc(item.pergunta)}</div>
              <div class="resposta">${esc(item.resposta) || '<span style="opacity:.4;">Não preenchido</span>'}</div>
            </div>
          `;
        }).join("")}
      </div>
    </div>
  `).join("");

  totalSlides = gruposFinal.length;
  document.getElementById("tl-dots").innerHTML = Array.from({ length: totalSlides }, (_, i) =>
    `<span data-goto="${i + 1}"></span>`).join("");
  document.querySelectorAll("#tl-dots span").forEach(dot => {
    dot.addEventListener("click", () => irParaSlide(Number(dot.dataset.goto)));
  });

  showScreen("screen-telao");
  irParaSlide(1);
}

function irParaSlide(n) {
  slideAtual = Math.max(1, Math.min(totalSlides, n));
  document.querySelectorAll(".tl-slide").forEach(s => s.classList.toggle("active", Number(s.dataset.slide) === slideAtual));
  document.querySelectorAll("#tl-dots span").forEach(d => d.classList.toggle("active", Number(d.dataset.goto) === slideAtual));
  document.getElementById("tl-prev").classList.toggle("hidden", slideAtual === 1);
  document.getElementById("tl-next").classList.toggle("hidden", slideAtual === totalSlides);
}
document.getElementById("tl-prev").addEventListener("click", () => irParaSlide(slideAtual - 1));
document.getElementById("tl-next").addEventListener("click", () => irParaSlide(slideAtual + 1));
document.addEventListener("keydown", (e) => {
  if (!document.getElementById("screen-telao").classList.contains("active")) return;
  if (e.key === "ArrowRight") irParaSlide(slideAtual + 1);
  if (e.key === "ArrowLeft") irParaSlide(slideAtual - 1);
  if (e.key === "Escape") showScreen(telaAnterior);
});

document.getElementById("tl-exit").addEventListener("click", () => showScreen(telaAnterior));

// ============================================================
// LISTA DE TODOS OS GRUPOS (sem login)
// ============================================================
document.getElementById("btn-ver-todos").addEventListener("click", carregarListaGrupos);

async function carregarListaGrupos() {
  showScreen("screen-lista");
  const lista = document.getElementById("lista-grupos");
  lista.innerHTML = `<div class="vazio-msg">Carregando...</div>`;
  try {
    const snap = await getDocs(collection(db, "respostas"));
    if (snap.empty) {
      lista.innerHTML = `<div class="vazio-msg">Nenhuma resposta registrada ainda.</div>`;
      return;
    }
    const registros = [];
    snap.forEach(d => registros.push(d.data()));
    registros.sort((a, b) => (a.eixo + a.grupo).localeCompare(b.eixo + b.grupo));

    lista.innerHTML = registros.map((r, i) => {
      const eixoNum = r.eixo === "governanca" ? "Eixo 1 · Governança" : "Eixo 2 · Digital";
      return `
        <div class="grupo-item" data-idx="${i}">
          <div class="info">
            <div class="nome">${esc(r.grupo)}</div>
            <div class="eixo">${eixoNum}</div>
          </div>
          <div class="abrir">Apresentar →</div>
        </div>
      `;
    }).join("");

    lista.querySelectorAll(".grupo-item").forEach(item => {
      item.addEventListener("click", () => abrirTelao(registros[Number(item.dataset.idx)], "screen-lista"));
    });
  } catch (e) {
    lista.innerHTML = `<div class="vazio-msg">Erro ao carregar: ${esc(e.message)}</div>`;
  }
}
</script>
</body>
</html>
